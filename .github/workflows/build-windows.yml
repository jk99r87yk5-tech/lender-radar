name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tesseract
        run: choco install tesseract --yes

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Locate Tesseract
        id: tess
        shell: pwsh
        run: |
          $tess = "C:\Program Files\Tesseract-OCR\tesseract.exe"
          $data = "C:\Program Files\Tesseract-OCR\tessdata"
          echo "exe=$tess" >> $env:GITHUB_OUTPUT
          echo "data=$data" >> $env:GITHUB_OUTPUT

      - name: Locate tkinterdnd2
        id: dnd
        continue-on-error: true
        shell: pwsh
        run: |
          $path = python -c "import os,tkinterdnd2; print(os.path.dirname(tkinterdnd2.__file__))" 2>$null
          if ($path) { echo "path=$path" >> $env:GITHUB_OUTPUT }

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $cmd = @(
            "pyinstaller",
            "--name", "BankStatementParser",
            "--windowed",
            "--onedir",
            "--clean",
            "--noconfirm",
            "--hidden-import", "tkinter",
            "--hidden-import", "tkinter.ttk",
            "--hidden-import", "tkinter.messagebox",
            "--hidden-import", "tkinter.filedialog",
            "--collect-all", "tkinter",
            "--hidden-import", "pdfplumber",
            "--hidden-import", "pymupdf",
            "--hidden-import", "fitz",
            "--hidden-import", "pytesseract",
            "--hidden-import", "openpyxl",
            "--hidden-import", "PIL",
            "--hidden-import", "PIL.Image",
            "--hidden-import", "pypdfium2",
            "--collect-all", "pdfplumber",
            "--collect-all", "pymupdf",
            "--collect-all", "fitz",
            "--collect-all", "pypdfium2",
            "--add-binary", "${{ steps.tess.outputs.exe }};.",
            "--add-data",   "${{ steps.tess.outputs.data }};tessdata"
          )
          if ("${{ steps.dnd.outputs.path }}" -ne "") {
            $cmd += "--hidden-import", "tkinterdnd2"
            $cmd += "--add-data", "${{ steps.dnd.outputs.path }};tkinterdnd2"
          }
          $cmd += "app.py"
          & $cmd[0] $cmd[1..($cmd.Length-1)]

      - name: Zip the output
        shell: pwsh
        run: |
          Compress-Archive -Path dist\BankStatementParser -DestinationPath dist\BankStatementParser-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankStatementParser-Windows
          path: dist/BankStatementParser-Windows.zip
          retention-days: 30
